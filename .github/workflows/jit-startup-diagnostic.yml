name: Build JIT Startup Diagnostic

on:
  push:
    branches:
      - diagnostic/jit-startup-5s
    paths:
      - .github/workflows/jit-startup-diagnostic.yml
      - browser/Reynard/JIT/JITController.swift
      - browser/Reynard/main.swift
      - browser/GeckoView/Runtime/GeckoRuntime.swift
      - browser/GeckoView/Session/GeckoSession.swift
      - tools/development/inject-startup-trace.py
      - tools/development/inject-lazy-restore-diagnostic.py
      - tools/development/inject-startup-critical-path-diagnostic.py
      - tools/development/inject-single-restored-tab-diagnostic.py
      - tools/development/inject-extension-completion-queue-diagnostic.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TrollStore JIT startup diagnostic
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "jit-startup-diagnostic"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "jit-startup-diagnostic"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Inject startup trace
        run: python tools/development/inject-startup-trace.py

      - name: Inject lazy restored-session diagnostic
        run: python tools/development/inject-lazy-restore-diagnostic.py

      - name: Inject startup critical-path diagnostic
        run: python tools/development/inject-startup-critical-path-diagnostic.py

      - name: Pin startup to one restored web tab
        run: python tools/development/inject-single-restored-tab-diagnostic.py

      - name: Decouple NSExtension completion delivery
        run: python tools/development/inject-extension-completion-queue-diagnostic.py

      - name: Verify diagnostic injection
        run: |
          grep -n "diagnosticBypassJIT = false" browser/Reynard/JIT/JITController.swift
          grep -n 'directoryPath = "/var/mobile/Documents/ReynardDiagnostics"' browser/GeckoView/Runtime/GeckoRuntime.swift
          grep -n 'logPath = directoryPath + "/startup.log"' browser/GeckoView/Runtime/GeckoRuntime.swift
          grep -n "GeckoSession.open before GeckoViewOpenWindow" browser/GeckoView/Session/GeckoSession.swift
          grep -n "before beginExtensionRequestWithInputItems" engine/firefox/ipc/glue/NSExtensionUtils.mm
          test "$(grep -F -c 'dispatch_async(ExtensionLaunchQueue(), ^{' engine/firefox/ipc/glue/NSExtensionUtils.mm)" -eq 1
          test "$(grep -F -c 'dispatch_async(ExtensionCompletionQueue(), ^{' engine/firefox/ipc/glue/NSExtensionUtils.mm)" -eq 1
          grep -n "ExtensionProcess completion queue ENTER" engine/firefox/ipc/glue/NSExtensionUtils.mm
          grep -n 'com.minh-ton.Reynard.ExtensionCompletionQueue' engine/firefox/ipc/glue/NSExtensionUtils.mm
          ! grep -q "dispatch_get_global_queue(QOS_CLASS_DEFAULT, 0)" engine/firefox/ipc/glue/NSExtensionUtils.mm
          grep -n "before xpc bootstrap send" engine/firefox/ipc/glue/GeckoChildProcessHost.cpp
          grep -n "childID=%d" engine/firefox/ipc/glue/GeckoChildProcessHost.cpp
          grep -n "GeckoViewOpenWindow before nsIWindowWatcher::OpenWindow" engine/firefox/widget/uikit/nsWindow.mm
          grep -n "GetCompositorWidgetInitData before monitor wait" engine/firefox/widget/uikit/nsWindow.mm
          test "$(grep -c 'opening: .manual' browser/Reynard/Client/TabManagement/TabManagerImpl.swift)" -eq 2
          grep -n 'opening: opening ?? .immediate(windowID: windowId)' browser/Reynard/Client/TabManagement/TabManagerImpl.swift
          grep -n "diagnosticSelectionHasRemoteURL" browser/Reynard/Client/TabManagement/TabManagerImpl.swift
          grep -n "critical single-restored-tab keeping selected web tab" browser/Reynard/Client/TabManagement/TabManagerImpl.swift
          grep -n "critical restored-load-request" browser/Reynard/Client/TabManagement/TabManagerImpl.swift
          grep -n "launch childID=%d remoteType=%s" engine/firefox/dom/ipc/ContentParent.cpp
          grep -n 'pref("dom.ipc.processPrelaunch.enabled", true);' engine/firefox/mobile/ios/app/mobile.js
          ! grep -q 'dom.ipc.processPrelaunch.delayMs' engine/firefox/mobile/ios/app/mobile.js
          ! grep -q 'dom.ipc.processPrelaunch.fission.number' engine/firefox/mobile/ios/app/mobile.js
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-jit-startup-diagnostic-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-standard-${{ steps.rust_toolchain.outputs.hash }}-
            buildcache-gecko-deps-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing

      - name: Create TrollStore TIPA
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Rename diagnostic artifact
        run: mv dist/Reynard-TrollStore.tipa dist/Reynard-Lazy-Restore-Decoupled-Completion-Diagnostic.tipa

      - name: Upload TrollStore diagnostic TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Lazy-Restore-Decoupled-Completion-Diagnostic.tipa
          path: dist/Reynard-Lazy-Restore-Decoupled-Completion-Diagnostic.tipa
          if-no-files-found: error
